name: Scraper FL

# Diario a las 07:00 UTC. Mientras quede backfill, cada corrida se lleva lo que
# falte; cuando ya no quede, se convierte sola en el ciclo incremental — el
# refresco por antigüedad (abajo) devuelve a la cola lo consultado hace mucho.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Correr solo N carriers (vacío = todos)"
        required: false
        default: ""
      refresh_older_than:
        description: "Reconsultar lo scrapeado hace más de N días (vacío = 90)"
        required: false
        default: ""
      retry_errors:
        description: "Reintentar los carriers que quedaron en error"
        type: boolean
        default: false
      tables:
        description: "Tablas a recargar en Supabase"
        type: choice
        default: "ucc_filings maestro"
        options:
          - "ucc_filings maestro"
          - "carriers ucc_filings maestro"

concurrency:
  # Dos runs a la vez se pisarían el movik.db y el checkpoint.
  group: scraper-fl
  cancel-in-progress: false

# El GITHUB_TOKEN por defecto no llega a la API de Actions, así que
# `gh run list` / `gh run download` responden 403 y el run no encuentra el
# movik.db del run anterior. contents:read es para el release db-seed.
permissions:
  contents: read
  actions: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Tope de GitHub Actions: 6 h. El scraper guarda checkpoint, así que un run
    # cortado se retoma donde quedó en el siguiente.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # movik.db no vive en el repo (168 MB): viaja como artifact de un run al
      # siguiente. Si no hay run previo (el primero, o los artifacts vencieron)
      # cae al release "db-seed", que es la copia semilla con el censo cargado.
      # Para refrescar esa semilla:  bash seed_db.sh
      - name: Recuperar movik.db
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # || true porque el step corre con `bash -e`: si gh falla, la
          # asignación falla y el step muere antes de intentar el release.
          PREV=$(gh run list --workflow=scraper_fl.yml --status=success \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$PREV" ] && gh run download "$PREV" --name movik-state-fl --dir .; then
            echo "Estado restaurado del run $PREV"
          else
            echo "Sin artifact previo; bajando el release db-seed"
            gh release download db-seed --pattern 'movik.db' --clobber
          fi
          # Sin movik.db el scraper no tiene carriers que consultar y el run
          # sería un no-op silencioso: mejor fallar aquí y decir por qué.
          if [ ! -f movik.db ]; then
            echo "::error::No hay artifact previo ni release db-seed. Corre seed_db.sh."
            exit 1
          fi
          ls -lh movik.db scraper_checkpoint.json 2>/dev/null || true

      # Sin esto el ciclo incremental solo re-consultaria carriers que ya
      # conocemos: los que el FMCSA da de alta despues del ultimo censo no
      # entrarian nunca, y el scraper no puede consultar lo que no esta en
      # `carriers`.
      #
      # --delta-only y no un pull normal: el workspace de un runner nace vacio,
      # asi que census_file_full.csv no esta y 01_census_incremental.py caeria
      # en su rama de "pull completo" — 4,4M filas y 1,7 GB cada dia. Meter ese
      # CSV en el artifact tampoco cabe: el plan free da 500 MB. El delta del
      # 14/07 al 05/08 fueron 4.237 filas y 1,7 MB.
      #
      # continue-on-error: si la API del FMCSA esta caida, la pasada de scraping
      # vale igual. Se pierde el alta del dia, no el trabajo del run.
      - name: Traer carriers nuevos del censo FMCSA
        id: censo
        continue-on-error: true
        run: |
          # Arranque en frio: sin census_state.json (primer run con este paso, o
          # artifact vencido) el watermark sale de movik.db. carriers.mcs150_date
          # es la misma columna del censo, asi que su MAX() es exactamente donde
          # quedo el ultimo pull — no hace falta sembrar nada a mano.
          python - <<'PY'
          import json, os, sqlite3
          if not os.path.exists("census_state.json"):
              c = sqlite3.connect("movik.db")
              (m,) = c.execute("SELECT MAX(mcs150_date) FROM carriers "
                               "WHERE mcs150_date IS NOT NULL "
                               "AND mcs150_date <> ''").fetchone()
              json.dump({"last_max_date": m}, open("census_state.json", "w"))
              print(f"census_state.json ausente; watermark desde movik.db: {m}")
          PY
          python -u 01_census_incremental.py --delta-only census_delta.csv
          python -u 05_load_carriers_db.py --csv census_delta.csv --states FL

      # timeout en el PASO, no solo en el job. Si el job se cancela por su
      # propio timeout, los pasos siguientes no corren: asi se perdio la carga
      # a Supabase de los 28.385 carriers del primer run, que quedaron solo en
      # el artifact. Acotando el paso, el job sigue vivo y guarda y carga
      # normal. continue-on-error para que quedarse corto de tiempo —lo normal
      # en un backfill de varias pasadas— no pinte el run de rojo.
      - name: Correr scraper FL
        id: scrape
        timeout-minutes: 320
        continue-on-error: true
        run: |
          ARGS="--states FL"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --test ${{ inputs.limit }}"; fi
          if [ "${{ inputs.retry_errors }}" = "true" ]; then ARGS="$ARGS --retry-errors"; fi
          # En las corridas por cron `inputs` viene vacío, así que el default se
          # pone aquí y no en el bloque de arriba. 90 días: un UCC vence, se
          # renueva o aparece uno nuevo, y a los tres meses el dato guardado ya
          # no es de fiar. Mientras quede backfill esto no cambia nada — los
          # pendientes van primero igual.
          REFRESH="${{ inputs.refresh_older_than }}"
          ARGS="$ARGS --refresh-older-than ${REFRESH:-90}"
          echo "python ucc_scraper.py $ARGS"
          python -u ucc_scraper.py $ARGS

      # Se guarda aunque el scraper falle a mitad: el checkpoint y las filas ya
      # escritas valen igual, y perderlos obligaría a re-scrapear todo.
      # census_state.json viaja con el estado: es el watermark del censo. Si se
      # pierde, el paso del censo lo reconstruye desde movik.db, pero entonces
      # se re-descargan los deltas ya aplicados — barato, aunque evitable.
      # census_delta.csv NO se guarda: es de usar y tirar, ya esta en movik.db.
      - name: Guardar movik.db + checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movik-state-fl
          path: |
            movik.db
            scraper_checkpoint.json
            census_state.json
          retention-days: 90
          if-no-files-found: warn

      # always(): lo scrapeado hasta el corte vale igual, y si esto no corre los
      # datos se quedan encerrados en el artifact.
      # --state FL es obligatorio: este movik.db viene del artifact movik-state-fl,
      # que no tiene lo que el workflow de CA haya scrapeado en su propio fork.
      # Sin acotar, el reemplazo borraria de Supabase todo el avance de CA.
      - name: Cargar a Supabase (schema movik)
        if: always() && hashFiles('movik.db') != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -u load_to_supabase.py --state FL --only ${{ inputs.tables }}

      - name: Resumen
        if: always()
        run: |
          echo "### Scraper FL" >> $GITHUB_STEP_SUMMARY
          echo "- censo:   \`${{ steps.censo.outcome }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- scraper: \`${{ steps.scrape.outcome }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.scrape.outcome }}" != "success" ]; then
            echo "- El scraper no termino la lista. Es lo esperado en un" \
                 "backfill: relanzar el workflow para seguir donde quedo." \
                 >> $GITHUB_STEP_SUMMARY
          fi
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import sqlite3
          c = sqlite3.connect("movik.db")
          hechos, tot = c.execute("""
              SELECT SUM(CASE WHEN s.dot_number IS NOT NULL THEN 1 ELSE 0 END),
                     COUNT(*)
                FROM carriers c LEFT JOIN scrape_log s
                  ON s.dot_number = c.dot_number
               WHERE c.phy_state = 'FL'""").fetchone()
          print(f"- FL: {hechos:,} de {tot:,} ({hechos/tot*100:.1f}%) — "
                f"pendientes {tot-hechos:,}")
          PY
