name: Scraper FL

# Manual por ahora. Cuando el backfill esté completo, agregar:
#   schedule:
#     - cron: "0 7 * * *"
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Correr solo N carriers (vacío = todos)"
        required: false
        default: ""
      retry_errors:
        description: "Reintentar los carriers que quedaron en error"
        type: boolean
        default: false
      tables:
        description: "Tablas a recargar en Supabase"
        type: choice
        default: "ucc_filings maestro"
        options:
          - "ucc_filings maestro"
          - "carriers ucc_filings maestro"

concurrency:
  # Dos runs a la vez se pisarían el movik.db y el checkpoint.
  group: scraper-fl
  cancel-in-progress: false

# El GITHUB_TOKEN por defecto no llega a la API de Actions, así que
# `gh run list` / `gh run download` responden 403 y el run no encuentra el
# movik.db del run anterior. contents:read es para el release db-seed.
permissions:
  contents: read
  actions: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Tope de GitHub Actions: 6 h. El scraper guarda checkpoint, así que un run
    # cortado se retoma donde quedó en el siguiente.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # movik.db no vive en el repo (168 MB): viaja como artifact de un run al
      # siguiente. Si no hay run previo (el primero, o los artifacts vencieron)
      # cae al release "db-seed", que es la copia semilla con el censo cargado.
      # Para refrescar esa semilla:  bash seed_db.sh
      - name: Recuperar movik.db
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # || true porque el step corre con `bash -e`: si gh falla, la
          # asignación falla y el step muere antes de intentar el release.
          PREV=$(gh run list --workflow=scraper_fl.yml --status=success \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$PREV" ] && gh run download "$PREV" --name movik-state-fl --dir .; then
            echo "Estado restaurado del run $PREV"
          else
            echo "Sin artifact previo; bajando el release db-seed"
            gh release download db-seed --pattern 'movik.db' --clobber
          fi
          # Sin movik.db el scraper no tiene carriers que consultar y el run
          # sería un no-op silencioso: mejor fallar aquí y decir por qué.
          if [ ! -f movik.db ]; then
            echo "::error::No hay artifact previo ni release db-seed. Corre seed_db.sh."
            exit 1
          fi
          ls -lh movik.db scraper_checkpoint.json 2>/dev/null || true

      - name: Correr scraper FL
        run: |
          ARGS="--states FL"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --test ${{ inputs.limit }}"; fi
          if [ "${{ inputs.retry_errors }}" = "true" ]; then ARGS="$ARGS --retry-errors"; fi
          echo "python ucc_scraper.py $ARGS"
          python -u ucc_scraper.py $ARGS

      # Se guarda aunque el scraper falle a mitad: el checkpoint y las filas ya
      # escritas valen igual, y perderlos obligaría a re-scrapear todo.
      - name: Guardar movik.db + checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movik-state-fl
          path: |
            movik.db
            scraper_checkpoint.json
          retention-days: 90
          if-no-files-found: warn

      - name: Cargar a Supabase (schema movik)
        if: success()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -u load_to_supabase.py --only ${{ inputs.tables }}
