name: Scraper CA

# CA corre en un runner SELF-HOSTED, no en los de GitHub. Dos razones:
#
# 1. Minutos. El backfill de CA son ~316.000 carriers a 0,4 req/s. En runners
#    de GitHub eso pasa de 14.000 minutos, y el plan free de la org da 2.000 al
#    mes. En self-hosted los minutos no se cobran.
# 2. El WAF. Incapsula cuenta VOLUMEN, no velocidad: corta cerca de la request
#    ~3.000 sea cual sea el rate (ver ca_ucc_scraper.py:109-112). Por eso cada
#    corrida hace UNA pasada de ~3.000 carriers y sale; el cron trae la
#    siguiente. Ojo con la contrapartida del self-hosted: siempre es la MISMA
#    IP, asi que entre pasada y pasada hace falta enfriamiento de verdad — que
#    es lo que sondea ca_resume.py antes de dejar arrancar al scraper.
#
# A ~3.000 por pasada y 4 pasadas al dia, el backfill son ~26 dias.

on:
  schedule:
    # Cada 6 h. Espaciado a proposito: es el enfriamiento entre bloqueos del WAF.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      cooldown:
        description: "Minutos de enfriamiento antes del primer sondeo"
        required: false
        default: "0"
      workers:
        description: "Peticiones en paralelo (vacío = default del scraper)"
        required: false
        default: ""
      rate:
        description: "Techo de requests/segundo (vacío = default del scraper)"
        required: false
        default: ""
      retry_errors:
        description: "Reintentar los carriers que quedaron en error"
        type: boolean
        default: false
      tables:
        description: "Tablas a recargar en Supabase"
        type: choice
        default: "ucc_filings maestro"
        options:
          - "ucc_filings maestro"
          - "carriers ucc_filings maestro"

concurrency:
  group: scraper-ca
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: [self-hosted, movik-ca]
    # Tope generoso: en self-hosted no hay limite de 6 h de GitHub, y quien
    # corta de verdad es el WAF. Esto solo evita un run colgado para siempre.
    timeout-minutes: 600

    # El runner es Windows: sin esto los `run:` se interpretan con PowerShell y
    # la sintaxis de abajo (que es sh) revienta.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          # movik.db vive FUERA del workspace (ver abajo), pero checkout borra
          # los archivos sin seguimiento y se llevaria el checkpoint por delante.
          clean: false

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # En self-hosted el estado NO viaja como artifact: son 300 MB de subida y
      # bajada por pasada, y el disco del runner persiste entre runs. Se guarda
      # fuera del workspace para que `checkout` no lo toque nunca.
      - name: Recuperar movik.db del disco del runner
        run: |
          ESTADO="$HOME/movik-state-ca"
          mkdir -p "$ESTADO"
          if [ -f "$ESTADO/movik.db" ]; then
            cp "$ESTADO/movik.db" movik.db
            [ -f "$ESTADO/ca_scraper_checkpoint.json" ] && \
              cp "$ESTADO/ca_scraper_checkpoint.json" ca_scraper_checkpoint.json
            echo "Estado restaurado de $ESTADO"
          else
            echo "Primera corrida en este runner: bajando el release db-seed"
            gh release download db-seed --pattern 'movik.db' --clobber
          fi
          if [ ! -f movik.db ]; then
            echo "::error::No hay estado local ni release db-seed. Corre seed_db.sh."
            exit 1
          fi
          ls -lh movik.db
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sin esto el scraper arranca contra una IP todavia marcada y lo unico que
      # consigue es refrescar la marca. Sale 1 si tras 6 h sigue bloqueada: ahi
      # el problema ya no es transitorio y hace falta rotar IP.
      - name: Esperar via libre del portal
        id: probe
        run: |
          python -u ca_resume.py --probe-only \
            --cooldown "${{ inputs.cooldown || '0' }}"

      - name: Correr scraper CA
        id: scrape
        continue-on-error: true
        run: |
          ARGS=""
          if [ -n "${{ inputs.workers }}" ]; then ARGS="$ARGS --workers ${{ inputs.workers }}"; fi
          if [ -n "${{ inputs.rate }}" ]; then ARGS="$ARGS --rate ${{ inputs.rate }}"; fi
          if [ "${{ inputs.retry_errors }}" = "true" ]; then ARGS="$ARGS --retry-errors"; fi
          echo "python ca_ucc_scraper.py $ARGS"
          python -u ca_ucc_scraper.py $ARGS

      # Antes de cargar: si esto no corre, la pasada se pierde entera.
      - name: Guardar estado en el disco del runner
        if: always()
        run: |
          ESTADO="$HOME/movik-state-ca"
          mkdir -p "$ESTADO"
          cp movik.db "$ESTADO/movik.db"
          [ -f ca_scraper_checkpoint.json ] && \
            cp ca_scraper_checkpoint.json "$ESTADO/ca_scraper_checkpoint.json"
          ls -lh "$ESTADO"

      # --state CA es obligatorio: este movik.db es el fork de CA y no tiene lo
      # que el workflow de FL haya scrapeado en el suyo. Sin acotar, el
      # reemplazo borraria de Supabase todo el avance de FL.
      - name: Cargar a Supabase (schema movik)
        if: always() && hashFiles('movik.db') != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -u load_to_supabase.py --state CA --only ${{ inputs.tables || 'ucc_filings maestro' }}

      - name: Resumen
        if: always()
        run: |
          echo "### Scraper CA" >> $GITHUB_STEP_SUMMARY
          echo "- sondeo:  \`${{ steps.probe.outcome }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- scraper: \`${{ steps.scrape.outcome }}\`" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, sqlite3, pathlib
          c = sqlite3.connect("movik.db")
          hechos, tot = c.execute("""
              SELECT SUM(CASE WHEN s.dot_number IS NOT NULL THEN 1 ELSE 0 END),
                     COUNT(*)
                FROM carriers c LEFT JOIN scrape_log s
                  ON s.dot_number = c.dot_number
               WHERE c.phy_state = 'CA'""").fetchone()
          print(f"- CA: {hechos:,} de {tot:,} ({hechos/tot*100:.1f}%) — "
                f"pendientes {tot-hechos:,}")
          # El numero que decide si el plan aguanta: cuanto rindio ESTA pasada
          # antes de que el WAF cortara. Si cae pasada a pasada, la IP se esta
          # quemando y no hay cron que lo arregle.
          ck = pathlib.Path("ca_scraper_checkpoint.json")
          if ck.exists():
              d = json.loads(ck.read_text())
              print(f"- Esta pasada: {d.get('done', 0):,} carriers en "
                    f"{d.get('elapsed_s', 0)/60:.0f} min · "
                    f"WAF corto en la request #{d.get('waf_first_block_at_request')} · "
                    f"abortada: {d.get('aborted')}")
          PY
