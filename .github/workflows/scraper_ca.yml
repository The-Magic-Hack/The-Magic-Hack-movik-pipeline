name: Scraper CA

# CA corre en un runner SELF-HOSTED Windows, no en los de GitHub. Dos razones:
#
# 1. Minutos. El backfill de CA son ~316.000 carriers a 0,4 req/s. En runners
#    de GitHub eso pasa de 14.000 minutos, y el plan free de la org da 2.000 al
#    mes. En self-hosted los minutos no se cobran.
# 2. El WAF. Incapsula cuenta VOLUMEN, no velocidad: corta cerca de la request
#    ~3.000 sea cual sea el rate (ver ca_ucc_scraper.py:109-112). Por eso cada
#    corrida hace UNA pasada de ~3.000 carriers y sale; el cron trae la
#    siguiente. Ojo con la contrapartida del self-hosted: siempre es la MISMA
#    IP, asi que entre pasada y pasada hace falta enfriamiento de verdad — que
#    es lo que sondea ca_resume.py antes de dejar arrancar al scraper.
#
# A ~3.000 por pasada y 4 pasadas al dia, el backfill son ~26 dias.
#
# NADA DE `shell: bash` AQUI
# --------------------------
# En este runner `bash` resuelve a C:\WINDOWS\system32\bash.EXE, que es el stub
# de WSL, y sin distribucion instalada revienta con "Windows Subsystem for Linux
# has no installed distributions". En los runners de GitHub el bash de Git for
# Windows va primero en el PATH; aqui gana system32. Los pasos van en
# PowerShell, que es el default del runner en Windows y no depende del PATH.

on:
  schedule:
    # Cada 6 h. Espaciado a proposito: es el enfriamiento entre bloqueos del WAF.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      cooldown:
        description: "Minutos de enfriamiento antes del primer sondeo"
        required: false
        default: "0"
      workers:
        description: "Peticiones en paralelo (vacío = default del scraper)"
        required: false
        default: ""
      rate:
        description: "Techo de requests/segundo (vacío = default del scraper)"
        required: false
        default: ""
      retry_errors:
        description: "Reintentar los carriers que quedaron en error"
        type: boolean
        default: false
      tables:
        description: "Tablas a recargar en Supabase"
        type: choice
        default: "ucc_filings maestro"
        options:
          - "ucc_filings maestro"
          - "carriers ucc_filings maestro"

concurrency:
  group: scraper-ca
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Fuera del workspace: `checkout` limpia el suyo y se llevaria el estado por
  # delante. Ruta absoluta y fuera de C:\Users para que funcione sea cual sea la
  # cuenta con la que corra el servicio del runner.
  ESTADO: C:\movik-state\ca

jobs:
  scrape:
    runs-on: [self-hosted, movik-ca]
    # En self-hosted no hay limite de 6 h de GitHub, y quien corta de verdad es
    # el WAF. Esto solo evita un run colgado para siempre.
    timeout-minutes: 600

    # -ExecutionPolicy Bypass, o el job no arranca. El runner escribe cada paso
    # a un .ps1 en _temp y lo invoca con dot-sourcing; en esta maquina la
    # directiva de LocalMachine esta Undefined —o sea Restricted— y cargar ese
    # archivo da "running scripts is disabled on this system". El usuario tiene
    # RemoteSigned, pero eso solo vale si el servicio corre con SU cuenta.
    # Bypass aqui lo hace independiente de la cuenta y no cambia nada global,
    # que es preferible a un Set-ExecutionPolicy con admin sobre la maquina.
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      # Falla temprano y diciendo por que. Si el servicio del runner corre como
      # NETWORK SERVICE no ve el Python instalado por usuario, y sin esto el
      # error aparece tres pasos mas abajo disfrazado de otra cosa.
      - name: Comprobar Python
        run: |
          $py = Get-Command python -ErrorAction SilentlyContinue
          if (-not $py) {
            Write-Output "::error::python no esta en el PATH de la cuenta del runner ($env:USERNAME). Python esta instalado por usuario; configura el servicio del runner para que corra como ese usuario, o instala Python para todos los usuarios."
            exit 1
          }
          Write-Output "python: $($py.Source)"
          python --version
          Write-Output "cuenta del runner: $env:USERDOMAIN\$env:USERNAME"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # El estado persiste en el disco del runner: son 300 MB y subirlos y
      # bajarlos como artifact en cada pasada es tiempo tirado. El directorio se
      # siembra una vez (copiando un movik.db al dia) y de ahi en adelante lo
      # mantiene el paso de guardado.
      - name: Recuperar movik.db del disco del runner
        run: |
          if (-not (Test-Path "$env:ESTADO\movik.db")) {
            Write-Output "::error::No hay movik.db en $env:ESTADO. Siembra el directorio copiando alli un movik.db al dia (o corre seed_db.sh)."
            exit 1
          }
          Copy-Item "$env:ESTADO\movik.db" movik.db -Force
          $ck = "$env:ESTADO\ca_scraper_checkpoint.json"
          if (Test-Path $ck) { Copy-Item $ck ca_scraper_checkpoint.json -Force }
          Write-Output "Estado restaurado de $env:ESTADO"
          Get-Item movik.db | Select-Object Name,@{n='MB';e={[math]::Round($_.Length/1MB)}} | Format-Table

      # Sin esto el scraper arranca contra una IP todavia marcada y lo unico que
      # consigue es refrescar la marca. Sale 1 si tras 6 h sigue bloqueada: ahi
      # el problema ya no es transitorio y hace falta rotar IP.
      - name: Esperar via libre del portal
        id: probe
        run: |
          $cd = if ("${{ inputs.cooldown }}") { "${{ inputs.cooldown }}" } else { "0" }
          python -u ca_resume.py --probe-only --cooldown $cd

      - name: Correr scraper CA
        id: scrape
        continue-on-error: true
        run: |
          $a = @()
          if ("${{ inputs.workers }}") { $a += @("--workers", "${{ inputs.workers }}") }
          if ("${{ inputs.rate }}")    { $a += @("--rate",    "${{ inputs.rate }}") }
          if ("${{ inputs.retry_errors }}" -eq "true") { $a += "--retry-errors" }
          Write-Output "python ca_ucc_scraper.py $a"
          python -u ca_ucc_scraper.py @a

      # Antes de cargar: si esto no corre, la pasada se pierde entera.
      - name: Guardar estado en el disco del runner
        if: always()
        run: |
          if (-not (Test-Path movik.db)) { Write-Output "Sin movik.db, nada que guardar"; exit 0 }
          New-Item -ItemType Directory -Force -Path $env:ESTADO | Out-Null
          Copy-Item movik.db "$env:ESTADO\movik.db" -Force
          if (Test-Path ca_scraper_checkpoint.json) {
            Copy-Item ca_scraper_checkpoint.json "$env:ESTADO\ca_scraper_checkpoint.json" -Force
          }
          Get-ChildItem $env:ESTADO | Select-Object Name,@{n='MB';e={[math]::Round($_.Length/1MB)}} | Format-Table

      # --state CA es obligatorio: este movik.db es el fork de CA y no tiene lo
      # que el workflow de FL haya scrapeado en el suyo. Sin acotar, el
      # reemplazo borraria de Supabase todo el avance de FL.
      - name: Cargar a Supabase (schema movik)
        if: always() && hashFiles('movik.db') != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          $t = if ("${{ inputs.tables }}") { "${{ inputs.tables }}" } else { "ucc_filings maestro" }
          python -u load_to_supabase.py --state CA --only $t.Split(" ")

      - name: Resumen
        if: always()
        run: |
          "### Scraper CA"                            | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- sondeo:  ``${{ steps.probe.outcome }}``"  | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- scraper: ``${{ steps.scrape.outcome }}``" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          python ca_progress.py | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
