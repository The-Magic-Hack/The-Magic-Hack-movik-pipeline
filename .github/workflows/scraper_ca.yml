name: Scraper CA

# Manual por ahora. Cuando el backfill esté completo, agregar:
#   schedule:
#     - cron: "0 9 * * *"
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Correr solo N carriers (vacío = todos)"
        required: false
        default: ""
      retry_errors:
        description: "Reintentar los carriers que quedaron en error"
        type: boolean
        default: false
      workers:
        description: "Peticiones en paralelo (vacío = default del scraper)"
        required: false
        default: ""
      tables:
        description: "Tablas a recargar en Supabase"
        type: choice
        default: "ucc_filings maestro"
        options:
          - "ucc_filings maestro"
          - "carriers ucc_filings maestro"

concurrency:
  group: scraper-ca
  cancel-in-progress: false

# El GITHUB_TOKEN por defecto no llega a la API de Actions, así que
# `gh run list` / `gh run download` responden 403 y el run no encuentra el
# movik.db del run anterior. contents:read es para el release db-seed.
permissions:
  contents: read
  actions: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Igual que en scraper_fl.yml: artifact del run anterior, y si no hay,
      # el release "db-seed". Refrescar la semilla con:  bash seed_db.sh
      - name: Recuperar movik.db
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # || true porque el step corre con `bash -e`: si gh falla, la
          # asignación falla y el step muere antes de intentar el release.
          PREV=$(gh run list --workflow=scraper_ca.yml --status=success \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$PREV" ] && gh run download "$PREV" --name movik-state-ca --dir .; then
            echo "Estado restaurado del run $PREV"
          else
            echo "Sin artifact previo; bajando el release db-seed"
            gh release download db-seed --pattern 'movik.db' --clobber
          fi
          # Sin movik.db el scraper no tiene carriers que consultar y el run
          # sería un no-op silencioso: mejor fallar aquí y decir por qué.
          if [ ! -f movik.db ]; then
            echo "::error::No hay artifact previo ni release db-seed. Corre seed_db.sh."
            exit 1
          fi
          ls -lh movik.db ca_scraper_checkpoint.json 2>/dev/null || true

      # ca_ucc_scraper.py NO acepta --state: es CA-only por diseño (pega contra
      # bizfileonline.sos.ca.gov). Sus flags son --test/--retry-errors/--reset/
      # --rate/--workers/--alerts-only.
      # timeout en el PASO, no solo en el job: si el job se cancela por su
      # propio timeout, los pasos siguientes no corren y la carga a Supabase se
      # pierde, dejando lo scrapeado encerrado en el artifact.
      - name: Correr scraper CA
        id: scrape
        timeout-minutes: 320
        continue-on-error: true
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --test ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.workers }}" ]; then ARGS="$ARGS --workers ${{ inputs.workers }}"; fi
          if [ "${{ inputs.retry_errors }}" = "true" ]; then ARGS="$ARGS --retry-errors"; fi
          echo "python ca_ucc_scraper.py $ARGS"
          python -u ca_ucc_scraper.py $ARGS

      - name: Guardar movik.db + checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movik-state-ca
          path: |
            movik.db
            ca_scraper_checkpoint.json
          retention-days: 90
          if-no-files-found: warn

      # always(): lo scrapeado hasta el corte vale igual.
      - name: Cargar a Supabase (schema movik)
        if: always() && hashFiles('movik.db') != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -u load_to_supabase.py --only ${{ inputs.tables }}

      - name: Resumen
        if: always()
        run: |
          echo "### Scraper CA" >> $GITHUB_STEP_SUMMARY
          echo "- scraper: \`${{ steps.scrape.outcome }}\`" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import sqlite3
          c = sqlite3.connect("movik.db")
          hechos, tot = c.execute("""
              SELECT SUM(CASE WHEN s.dot_number IS NOT NULL THEN 1 ELSE 0 END),
                     COUNT(*)
                FROM carriers c LEFT JOIN scrape_log s
                  ON s.dot_number = c.dot_number
               WHERE c.phy_state = 'CA'""").fetchone()
          print(f"- CA: {hechos:,} de {tot:,} ({hechos/tot*100:.1f}%) — "
                f"pendientes {tot-hechos:,}")
          PY
