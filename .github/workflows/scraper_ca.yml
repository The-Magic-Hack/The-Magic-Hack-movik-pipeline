name: Scraper CA

# CA corre en runners de GitHub, y eso es deliberado: lo que el backfill
# necesita no son minutos sino IPs.
#
# HISTORIA, PARA NO REPETIRLA
# ---------------------------
# Primero se monto en un runner self-hosted, buscando minutos gratis. Fallo:
# run 31072263961 sondeo 6 h seguidas, 37 intentos uno cada 10 min, HTTP 403 las
# 37 veces, cero carriers — y el ultimo scrape habia sido 11 dias antes. El WAF
# de Incapsula no limita ritmo sino identidad (ver ca_ucc_scraper.py:544), asi
# que una IP fija no sirve por barata que salga. Cada run de GitHub trae IP
# nueva, que es justo el recurso escaso.
#
# EL ESTADO VIAJA CIFRADO
# -----------------------
# El repo esta publico mientras dure el backfill, para que estos runners no
# cuesten minutos. Pero los artifacts de un repo publico los descarga
# cualquiera, y movik.db son 532.167 carriers y 365.854 filings UCC cruzados y
# priorizados — el producto, no un dato publico cualquiera. Asi que el estado se
# comprime y se cifra con AES-256 antes de subirlo: el artifact es un blob
# inutil sin STATE_KEY. Se comprime ANTES de cifrar porque lo cifrado ya no
# comprime: al reves el artifact pasaria de ~99 MB a ~304 MB en cada run.
#
# Al terminar el backfill, volver el repo a privado.

on:
  schedule:
    # Cada 3 h. Una pasada dura ~2,3 h (la corta el WAF cerca de la request
    # ~3.000), asi que 3 h es lo mas apretado que se puede sin solaparse.
    # 8 pasadas/dia x ~3.000 = ~24.000/dia -> los 316.580 pendientes en ~13 dias.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      cooldown:
        description: "Minutos de enfriamiento antes del primer sondeo"
        required: false
        default: "0"
      workers:
        description: "Peticiones en paralelo (vacío = default del scraper)"
        required: false
        default: ""
      rate:
        description: "Techo de requests/segundo (vacío = default del scraper)"
        required: false
        default: ""
      retry_errors:
        description: "Reintentar los carriers que quedaron en error"
        type: boolean
        default: false
      tables:
        description: "Tablas a recargar en Supabase"
        type: choice
        default: "ucc_filings maestro"
        options:
          - "ucc_filings maestro"
          - "carriers ucc_filings maestro"

concurrency:
  # Dos runs a la vez se pisarian el movik.db y el checkpoint.
  group: scraper-ca
  cancel-in-progress: false

# actions:read para que `gh run download` vea el artifact del run anterior; el
# GITHUB_TOKEN por defecto no llega a la API de Actions y responde 403.
permissions:
  contents: read
  actions: read

env:
  ESTADO_ENC: movik-state-ca.gz.enc

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Sin la clave el run no puede ni leer el estado ni guardarlo, y sin este
      # corte el fallo aparece a mitad de camino disfrazado de "movik.db
      # corrupto". Se comprueba que existe, nunca se imprime.
      - name: Comprobar STATE_KEY
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          if [ -z "$STATE_KEY" ]; then
            echo "::error::Falta el secret STATE_KEY. Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "STATE_KEY presente (${#STATE_KEY} caracteres)"

      - name: Recuperar y descifrar movik.db
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          # || true porque el paso corre con `bash -e`: si gh falla, la
          # asignacion falla y el paso muere antes de intentar el release.
          PREV=$(gh run list --workflow=scraper_ca.yml --status=success \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$PREV" ] && gh run download "$PREV" --name movik-state-ca --dir .; then
            echo "Estado restaurado del run $PREV"
          else
            echo "Sin artifact previo; bajando la semilla cifrada del release db-seed"
            gh release download db-seed --pattern "$ESTADO_ENC" --clobber
          fi

          if [ ! -f "$ESTADO_ENC" ]; then
            echo "::error::No hay estado cifrado ni semilla. Sube $ESTADO_ENC al release db-seed."
            exit 1
          fi

          # -pass env: y no -pass pass:, que dejaria la clave en la linea de
          # comandos y por tanto en la lista de procesos del runner.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$ESTADO_ENC" -pass env:STATE_KEY | gunzip > movik.db
          rm -f "$ESTADO_ENC"
          ls -lh movik.db ca_scraper_checkpoint.json 2>/dev/null || true

      # Cada run trae IP nueva, asi que esto deberia pasar a la primera. Se deja
      # igualmente: si GitHub reasigna una IP ya quemada, mejor esperar que
      # gastar la pasada contra un 403.
      - name: Esperar via libre del portal
        id: probe
        run: python -u ca_resume.py --probe-only --cooldown "${{ inputs.cooldown || '0' }}"

      # timeout en el PASO, no solo en el job: si el job se cancela por su propio
      # timeout, los pasos siguientes no corren y lo scrapeado se queda encerrado
      # sin llegar a Supabase. continue-on-error porque el corte del WAF es el
      # final normal de una pasada, no un fallo.
      - name: Correr scraper CA
        id: scrape
        timeout-minutes: 320
        continue-on-error: true
        run: |
          ARGS=""
          if [ -n "${{ inputs.workers }}" ]; then ARGS="$ARGS --workers ${{ inputs.workers }}"; fi
          if [ -n "${{ inputs.rate }}" ]; then ARGS="$ARGS --rate ${{ inputs.rate }}"; fi
          if [ "${{ inputs.retry_errors }}" = "true" ]; then ARGS="$ARGS --retry-errors"; fi
          echo "python ca_ucc_scraper.py $ARGS"
          python -u ca_ucc_scraper.py $ARGS

      - name: Cifrar el estado
        if: always() && hashFiles('movik.db') != ''
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          gzip -c movik.db \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
                -out "$ESTADO_ENC" -pass env:STATE_KEY
          ls -lh "$ESTADO_ENC"

      # El checkpoint va en claro a proposito: son contadores de la pasada
      # (cuantos, cuantas requests, donde corto el WAF), sin datos de carriers.
      - name: Guardar estado cifrado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movik-state-ca
          path: |
            movik-state-ca.gz.enc
            ca_scraper_checkpoint.json
          retention-days: 90
          if-no-files-found: warn

      # always(): lo scrapeado hasta el corte del WAF vale igual, y si esto no
      # corre se queda encerrado en el artifact. Es lo que hace que la webapp
      # vea el avance de cada pasada.
      # --state CA acota el reemplazo: este movik.db es el fork de CA y no tiene
      # lo que FL haya scrapeado en el suyo. Sin acotar, borraria FL de Supabase.
      - name: Cargar a Supabase (schema movik)
        if: always() && hashFiles('movik.db') != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -u load_to_supabase.py --state CA --only ${{ inputs.tables || 'ucc_filings maestro' }}

      - name: Resumen
        if: always()
        run: |
          echo "### Scraper CA" >> $GITHUB_STEP_SUMMARY
          echo "- sondeo:  \`${{ steps.probe.outcome }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- scraper: \`${{ steps.scrape.outcome }}\`" >> $GITHUB_STEP_SUMMARY
          python ca_progress.py >> $GITHUB_STEP_SUMMARY
