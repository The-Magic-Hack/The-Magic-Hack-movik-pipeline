name: Scraper CA

# CA corre en runners de GitHub, y eso es deliberado: lo que el backfill
# necesita no son minutos sino IPs.
#
# HISTORIA, PARA NO REPETIRLA
# ---------------------------
# Primero se monto en un runner self-hosted, buscando minutos gratis. Fallo:
# run 31072263961 sondeo 6 h seguidas, 37 intentos uno cada 10 min, HTTP 403 las
# 37 veces, cero carriers — y el ultimo scrape habia sido 11 dias antes. El WAF
# de Incapsula no limita ritmo sino identidad (ver ca_ucc_scraper.py:544), asi
# que una IP fija no sirve por barata que salga. Cada run de GitHub trae IP
# nueva, que es justo el recurso escaso.
#
# EL ESTADO VIAJA CIFRADO
# -----------------------
# El repo esta publico mientras dure el backfill, para que estos runners no
# cuesten minutos. Pero los artifacts de un repo publico los descarga
# cualquiera, y movik.db son 532.167 carriers y 365.854 filings UCC cruzados y
# priorizados — el producto, no un dato publico cualquiera. Asi que el estado se
# comprime y se cifra con AES-256 antes de subirlo: el artifact es un blob
# inutil sin STATE_KEY. Se comprime ANTES de cifrar porque lo cifrado ya no
# comprime: al reves el artifact pasaria de ~99 MB a ~304 MB en cada run.
#
# Al terminar el backfill, volver el repo a privado.

on:
  schedule:
    # Cada 6 h, no 3. Un run puede agotar sus 350 min de tope, y con 3 h se
    # solapaban: el siguiente cancelaba al encolado y en 10 corridas no se
    # scrapeo ni un carrier. El grupo de concurrencia protege el estado, pero
    # solo si el cron deja terminar al que corre.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      cooldown:
        description: "Minutos de enfriamiento antes del primer sondeo"
        required: false
        default: "0"
      workers:
        description: "Peticiones en paralelo (vacío = default del scraper)"
        required: false
        default: ""
      rate:
        description: "Techo de requests/segundo (vacío = default del scraper)"
        required: false
        default: ""
      retry_errors:
        description: "Reintentar los carriers que quedaron en error"
        type: boolean
        default: false
      tables:
        description: "Tablas a recargar en Supabase"
        type: choice
        default: "ucc_filings maestro"
        options:
          - "ucc_filings maestro"
          - "carriers ucc_filings maestro"

concurrency:
  # Dos runs a la vez se pisarian el movik.db y el checkpoint.
  group: scraper-ca
  cancel-in-progress: false

# actions:read para que `gh run download` vea el artifact del run anterior; el
# GITHUB_TOKEN por defecto no llega a la API de Actions y responde 403.
permissions:
  contents: read
  actions: read

env:
  ESTADO_ENC: movik-state-ca.gz.enc

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Sin la clave el run no puede ni leer el estado ni guardarlo, y sin este
      # corte el fallo aparece a mitad de camino disfrazado de "movik.db
      # corrupto". Se comprueba que existe, nunca se imprime.
      - name: Comprobar STATE_KEY
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          if [ -z "$STATE_KEY" ]; then
            echo "::error::Falta el secret STATE_KEY. Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "STATE_KEY presente (${#STATE_KEY} caracteres)"

      - name: Recuperar y descifrar movik.db
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          # || true porque el paso corre con `bash -e`: si gh falla, la
          # asignacion falla y el paso muere antes de intentar el release.
          PREV=$(gh run list --workflow=scraper_ca.yml --status=success \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$PREV" ] && gh run download "$PREV" --name movik-state-ca --dir .; then
            echo "Estado restaurado del run $PREV"
          else
            echo "Sin artifact previo; bajando la semilla cifrada del release db-seed"
            gh release download db-seed --pattern "$ESTADO_ENC" --clobber
          fi

          if [ ! -f "$ESTADO_ENC" ]; then
            echo "::error::No hay estado cifrado ni semilla. Sube $ESTADO_ENC al release db-seed."
            exit 1
          fi

          # -pass env: y no -pass pass:, que dejaria la clave en la linea de
          # comandos y por tanto en la lista de procesos del runner.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$ESTADO_ENC" -pass env:STATE_KEY | gunzip > movik.db
          rm -f "$ESTADO_ENC"
          ls -lh movik.db ca_scraper_checkpoint.json 2>/dev/null || true

      # 15 min de tope. Antes eran 180, apostando a que "el portal cede por
      # TIEMPO, no por identidad" — deducido de un unico run (31184677242) que
      # entro tras 160 min de sondeo. Ese run era ruido, y encima scrapeo cero
      # porque murio en el bug del xlsx.
      #
      # LO QUE DICEN LOS DATOS (medido el 13/08/2026)
      # --------------------------------------------
      # 21 runs seguidos, ~384 sondeos, HTTP 403 en TODOS sin una excepcion. Y
      # el 403 llega en el request numero 1, con la IP recien estrenada: no hay
      # reputacion que reconstruir ni volumen acumulado que purgar. Incapsula
      # bloquea los rangos de datacenter de Azure/GitHub en bloque.
      #
      # Contraste que lo confirma: desde una IP residencial el primer GET
      # devuelve 200. Misma request, mismo codigo, mismo user-agent.
      #
      # Una espera no levanta un bloqueo por ASN — es imposible por
      # construccion. Sondear 180 min solo quemaba ~12 h de runner al dia para
      # saltarse la pasada igual. Con 15 min el run bloqueado muere en ~2 min y
      # el siguiente prueba con otra IP, que es la unica variable que importa.
      #
      # Si alguna vez vuelve a pasar, `restante` reparte el presupuesto solo y
      # quedan ~300 min de scraping, mas que los ~170 de antes.
      #
      # Salida 2 = bloqueado (no es fallo del programa); el resto del job se
      # salta y el run termina en limpio para que lo reintente el siguiente.
      - name: Esperar via libre del portal
        id: probe
        run: |
          t0=$SECONDS
          set +e
          python -u ca_resume.py --probe-only \
            --cooldown "${{ inputs.cooldown || '0' }}" --max-wait 15
          rc=$?
          set -e
          # El scraper no puede llevarse un tope fijo: el sondeo mas 320 de
          # scraping se pasan de los 350 del job, y cuando expira el JOB los
          # pasos siguientes no corren — asi se perdio una vez la carga de
          # 28.385 carriers, que se quedaron encerrados en el artifact. Se
          # reparte lo que de verdad queda: 350 menos lo gastado (mas ~10 de
          # checkout, deps y descifrado), menos ~25 para cifrar, subir y cargar.
          gastado=$(( (SECONDS - t0) / 60 + 10 ))
          restante=$(( 350 - gastado - 25 ))
          [ $restante -lt 10 ] && restante=10
          echo "restante=$restante" >> $GITHUB_OUTPUT
          echo "sondeo: ${gastado} min gastados; quedan ${restante} min para scrapear"
          if [ $rc -eq 0 ]; then
            echo "libre=true" >> $GITHUB_OUTPUT
          elif [ $rc -eq 2 ]; then
            echo "libre=false" >> $GITHUB_OUTPUT
            echo "::notice::IP bloqueada tras 15 min. Se salta esta pasada; lo reintenta el siguiente run."
          else
            echo "::error::ca_resume.py fallo con codigo $rc"
            exit $rc
          fi

      # timeout en el PASO, no solo en el job: si el job se cancela por su propio
      # timeout, los pasos siguientes no corren y lo scrapeado se queda encerrado
      # sin llegar a Supabase. continue-on-error porque el corte del WAF es el
      # final normal de una pasada, no un fallo.
      - name: Correr scraper CA
        id: scrape
        if: steps.probe.outputs.libre == 'true'
        timeout-minutes: ${{ steps.probe.outputs.restante }}
        continue-on-error: true
        run: |
          ARGS=""
          if [ -n "${{ inputs.workers }}" ]; then ARGS="$ARGS --workers ${{ inputs.workers }}"; fi
          if [ -n "${{ inputs.rate }}" ]; then ARGS="$ARGS --rate ${{ inputs.rate }}"; fi
          if [ "${{ inputs.retry_errors }}" = "true" ]; then ARGS="$ARGS --retry-errors"; fi
          echo "python ca_ucc_scraper.py $ARGS"
          python -u ca_ucc_scraper.py $ARGS

      # `continue-on-error` en el paso de arriba es necesario —que el WAF corte
      # es el final normal de una pasada, no un fallo— pero convierte CUALQUIER
      # muerte en un `success` verde. Asi paso desapercibido que el scraper
      # reventaba en 0,2 s buscando un xlsx que no existe en el runner: el run
      # entero salio en verde con cero carriers hechos.
      #
      # La distincion que importa no es exito/fallo sino si la pasada AVANZO.
      # Si el scraper murio sin procesar a nadie, esto para el job en rojo.
      - name: Comprobar que la pasada avanzo
        if: always() && steps.probe.outputs.libre == 'true'
        run: |
          if [ ! -f ca_scraper_checkpoint.json ]; then
            echo "::error::El scraper no dejo checkpoint: murio antes de empezar. Outcome: ${{ steps.scrape.outcome }}"
            exit 1
          fi
          python - <<'PY'
          import json, sys
          d = json.load(open("ca_scraper_checkpoint.json", encoding="utf-8"))
          done = d.get("done", 0)
          print(f"pasada: {done:,} carriers | abortada por WAF: {d.get('aborted')}")
          if done == 0:
              print("::error::La pasada no proceso ningun carrier. "
                    "No es un corte del WAF: es un fallo real del scraper.")
              sys.exit(1)
          PY

      - name: Cifrar el estado
        if: always() && steps.probe.outputs.libre == 'true' && hashFiles('movik.db') != ''
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          gzip -c movik.db \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
                -out "$ESTADO_ENC" -pass env:STATE_KEY
          ls -lh "$ESTADO_ENC"

      # El checkpoint va en claro a proposito: son contadores de la pasada
      # (cuantos, cuantas requests, donde corto el WAF), sin datos de carriers.
      - name: Guardar estado cifrado
        if: always() && steps.probe.outputs.libre == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: movik-state-ca
          path: |
            movik-state-ca.gz.enc
            ca_scraper_checkpoint.json
          retention-days: 90
          if-no-files-found: warn

      # always(): lo scrapeado hasta el corte del WAF vale igual, y si esto no
      # corre se queda encerrado en el artifact. Es lo que hace que la webapp
      # vea el avance de cada pasada.
      # --state CA acota el reemplazo: este movik.db es el fork de CA y no tiene
      # lo que FL haya scrapeado en el suyo. Sin acotar, borraria FL de Supabase.
      - name: Cargar a Supabase (schema movik)
        if: always() && steps.probe.outputs.libre == 'true' && hashFiles('movik.db') != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -u load_to_supabase.py --state CA --only ${{ inputs.tables || 'ucc_filings maestro' }}

      - name: Resumen
        if: always()
        run: |
          echo "### Scraper CA" >> $GITHUB_STEP_SUMMARY
          echo "- sondeo:  \`${{ steps.probe.outcome }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- scraper: \`${{ steps.scrape.outcome }}\`" >> $GITHUB_STEP_SUMMARY
          python ca_progress.py >> $GITHUB_STEP_SUMMARY
